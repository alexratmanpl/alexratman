<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alex Ratman</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --fg: #f2f2f2;
    --muted: #9aa0a6;
    --accent: #6ea8fe;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa;
      --fg: #14161a;
      --muted: #5b6068;
      --accent: #2f6fed;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <span class="badge">Coming soon</span>
    <h1>Alex Ratman</h1>
    <p>This site is under construction. Come back soon for projects, demos, and a bit about me.</p>
    <footer><a href="https://github.com/alexratmanpl">github.com/alexratmanpl</a></footer>
  </main>
</body>
</html>
